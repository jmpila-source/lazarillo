<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14243f">
<title>Lazarillo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
  html,body{margin:0;height:100%;background:#14243f;color:#f3dca6;font-family:system-ui,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:0 28px}
  img{width:104px;height:104px;border-radius:24px}
  h1{font-family:Georgia,serif;font-weight:600;font-size:32px;margin:0;color:#f7f1e6}
  p{margin:0;font-size:15px;opacity:.85}
  a{display:none;background:#d9a441;color:#14243f;text-decoration:none;font-weight:600;font-size:17px;padding:15px 28px;border-radius:16px}
</style>
</head>
<body>
<main>
  <img src="icono-192.png" alt="">
  <h1>Lazarillo</h1>
  <p id="msg">Abriendo…</p>
  <a id="abrir" href="#">Abrir Lazarillo</a>
</main>
<script>
  // Lanzador: abre la aplicación de Apps Script (termina en /exec)
  const URL_APP = 'https://script.google.com/a/macros/fomento.edu/s/AKfycbxbcOLddNxRPaSOI5ZG_UynwoAkdqXhmgwP5cTTYlBLA2d0BfuFhwSXK5LMBG7WSJA_/exec';
  const boton = document.getElementById('abrir');
  boton.href = URL_APP;

  function mostrarBoton() {
    document.getElementById('msg').textContent = 'Toca para volver a abrir';
    boton.style.display = 'inline-block';
  }

  // La primera vez abre Lazarillo directamente; si vuelves con la ✕, muestra el botón.
  let yaAbierta = false;
  try { yaAbierta = sessionStorage.getItem('abierta') === '1'; } catch (e) {}
  if (!yaAbierta) {
    try { sessionStorage.setItem('abierta', '1'); } catch (e) {}
    setTimeout(() => location.assign(URL_APP), 350);
  } else {
    mostrarBoton();
  }
  window.addEventListener('pageshow', e => { if (e.persisted) mostrarBoton(); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
