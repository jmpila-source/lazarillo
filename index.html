<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14243f">
<title>Lazarillo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
  html,body{margin:0;height:100%;background:#f7f1e6;font-family:system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #portada{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#14243f;color:#f3dca6;transition:opacity .4s;z-index:5}
  #portada img{width:96px;height:96px;border-radius:22px}
  #portada p{margin:0;font-size:15px;opacity:.85}
  #ayuda{display:none;text-align:center;padding:0 28px;line-height:1.5;font-size:15px}
  #ayuda a{display:inline-block;margin-top:14px;background:#d9a441;color:#14243f;text-decoration:none;font-weight:600;
    padding:13px 22px;border-radius:14px}
  /* Grabadora */
  #grab{position:fixed;inset:0;background:rgba(20,36,63,.94);color:#f7f1e6;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;z-index:10;padding:24px;text-align:center}
  #grab h2{font-family:Georgia,serif;font-weight:600;font-size:26px;margin:0;color:#f3dca6}
  #grab p{margin:0;font-size:15px;opacity:.85;max-width:300px;line-height:1.45}
  #crono{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums}
  #parar{width:110px;height:110px;border-radius:50%;border:none;background:#b3412f;color:#fff;display:grid;place-items:center;
    animation:latido 1.4s infinite}
  #parar span{width:34px;height:34px;border-radius:6px;background:#fff;display:block}
  @keyframes latido{0%{box-shadow:0 0 0 0 rgba(179,65,47,.6)}70%{box-shadow:0 0 0 26px rgba(179,65,47,0)}100%{box-shadow:0 0 0 0 rgba(179,65,47,0)}}
  #nivel{width:60%;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
  #nivel i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9a441,#e0705c)}
  #cancelar{background:none;border:none;color:#f3dca6;font-size:15px;text-decoration:underline;padding:8px}
</style>
</head>
<body>
<iframe id="app" allow="microphone *; autoplay *; clipboard-write *"></iframe>

<div id="portada">
  <img src="icono-192.png" alt="">
  <p id="cargando">Abriendo Lazarillo…</p>
  <div id="ayuda">No se ha podido abrir Lazarillo dentro de la app.<br>
    Comprueba que Chrome tiene iniciada la sesión con tu cuenta del colegio.<br>
    <a id="directo" href="#">Abrir Lazarillo directamente</a></div>
</div>

<div id="grab">
  <h2>Grabando</h2>
  <div id="crono">00:00</div>
  <div id="nivel"><i></i></div>
  <button id="parar" aria-label="Terminar grabación"><span></span></button>
  <p>Dicta el resumen y los acuerdos. Pulsa el botón rojo para terminar.</p>
  <button id="cancelar">Cancelar</button>
</div>

<script>
  // Dirección de la aplicación web de Apps Script (termina en /exec)
  const URL_APP = 'https://script.google.com/a/macros/fomento.edu/s/AKfycbxbcOLddNxRPaSOI5ZG_UynwoAkdqXhmgwP5cTTYlBLA2d0BfuFhwSXK5LMBG7WSJA_/exec';

  const $ = id => document.getElementById(id);
  const dos = n => String(n).padStart(2, '0');
  $('app').src = URL_APP;
  $('directo').href = URL_APP;

  const deGoogle = origen => /(^|\.)googleusercontent\.com$/.test(new URL(origen).hostname);

  let cargada = false;
  window.addEventListener('message', e => {
    if (!deGoogle(e.origin)) return;
    if (e.data === 'lazarillo-ok') {
      e.source.postMessage('lazarillo-envoltorio', e.origin);
      if (!cargada) {
        cargada = true;
        $('portada').style.opacity = 0;
        setTimeout(() => $('portada').remove(), 400);
      }
    }
    if (e.data && e.data.tipo === 'grabar') grabar(e.source, e.origin);
  });
  setTimeout(() => {
    if (!cargada) { $('cargando').style.display = 'none'; $('ayuda').style.display = 'block'; }
  }, 15000);

  // ---------- Grabadora (la hace el envoltorio, que tiene el permiso de micrófono) ----------
  let rec = null, flujo = null, trozos = [], inicio = 0, tic = null, raf = null, cancelado = false;

  async function grabar(destino, origen) {
    if (rec) return;
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (err) {
      alert('Lazarillo necesita permiso para usar el micrófono. Actívalo en Ajustes → Aplicaciones → Lazarillo (o Chrome) → Permisos → Micrófono.');
      return;
    }
    const tipos = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/webm'];
    const mime = tipos.find(t => MediaRecorder.isTypeSupported(t)) || '';
    rec = new MediaRecorder(flujo, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined);
    trozos = []; cancelado = false;
    rec.ondataavailable = ev => { if (ev.data.size) trozos.push(ev.data); };
    rec.onstop = () => {
      clearInterval(tic); cancelAnimationFrame(raf);
      flujo.getTracks().forEach(t => t.stop());
      $('grab').style.display = 'none';
      const duracion = $('crono').textContent;
      const tipo = rec.mimeType || mime || 'audio/webm';
      rec = null;
      if (cancelado) return;
      const blob = new Blob(trozos, { type: tipo });
      const lector = new FileReader();
      lector.onload = () => destino.postMessage({ tipo: 'audio', base64: String(lector.result).split(',')[1], mime: tipo, duracion }, origen);
      lector.readAsDataURL(blob);
    };
    rec.start(1000);
    inicio = Date.now();
    $('crono').textContent = '00:00';
    $('grab').style.display = 'flex';
    tic = setInterval(() => { const s = Math.floor((Date.now() - inicio) / 1000); $('crono').textContent = dos(Math.floor(s / 60)) + ':' + dos(s % 60); }, 500);
    try {
      const ctx = new AudioContext(), an = ctx.createAnalyser(); an.fftSize = 256;
      ctx.createMediaStreamSource(flujo).connect(an);
      const datos = new Uint8Array(an.frequencyBinCount);
      const pinta = () => { an.getByteFrequencyData(datos); const m = datos.reduce((a, b) => a + b, 0) / datos.length;
        $('nivel').firstElementChild.style.width = Math.min(100, m * 1.6) + '%'; raf = requestAnimationFrame(pinta); };
      pinta();
    } catch (e) {}
  }
  $('parar').onclick = () => { if (rec) rec.stop(); };
  $('cancelar').onclick = () => { cancelado = true; if (rec) rec.stop(); };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
