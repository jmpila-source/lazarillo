<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14243f">
<title>Lazarillo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
  html,body{margin:0;height:100%;background:#f7f1e6;font-family:system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #portada{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#14243f;color:#f3dca6;transition:opacity .4s}
  #portada img{width:96px;height:96px;border-radius:22px}
  #portada p{margin:0;font-size:15px;opacity:.85}
  #ayuda{display:none;text-align:center;padding:0 28px;line-height:1.5;font-size:15px}
  #ayuda a{display:inline-block;margin-top:14px;background:#d9a441;color:#14243f;text-decoration:none;font-weight:600;
    padding:13px 22px;border-radius:14px}
</style>
</head>
<body>
<iframe id="app" allow="microphone *; autoplay *; clipboard-write *" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="portada">
  <img src="icono-192.png" alt="">
  <p id="cargando">Abriendo Lazarillo…</p>
  <div id="ayuda">No se ha podido abrir Lazarillo dentro de la app.<br>
    Comprueba que Chrome tiene iniciada la sesión con tu cuenta del colegio.<br>
    <a id="directo" href="#">Abrir Lazarillo directamente</a></div>
</div>
<script>
  // Dirección de la aplicación web de Apps Script (termina en /exec)
  const URL_APP = 'https://script.google.com/a/macros/fomento.edu/s/AKfycbxbcOLddNxRPaSOI5ZG_UynwoAkdqXhmgwP5cTTYlBLA2d0BfuFhwSXK5LMBG7WSJA_/exec';

  const app = document.getElementById('app');
  app.src = URL_APP;
  document.getElementById('directo').href = URL_APP;

  let cargada = false;
  window.addEventListener('message', e => {
    if (e.data === 'lazarillo-ok') {
      cargada = true;
      const p = document.getElementById('portada');
      p.style.opacity = 0;
      setTimeout(() => p.remove(), 400);
    }
  });
  setTimeout(() => {
    if (!cargada) {
      document.getElementById('cargando').style.display = 'none';
      document.getElementById('ayuda').style.display = 'block';
    }
  }, 15000);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
